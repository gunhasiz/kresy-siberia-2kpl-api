[project]
name = "kresy-siberia-2kpl-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.0",
    "poethepoet>=0.44.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
]

[tool.poe.tasks]
dev = "fastapi dev app/main.py"
migration = "alembic revision --autogenerate -m"
upgrade = "alembic upgrade head"
